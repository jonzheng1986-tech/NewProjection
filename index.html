<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>New Projection — Monochrome RTS</title>

  <link rel="stylesheet" href="./styles.css" />
